name: Bloom Meetings checks
on:
  pull_request:
    paths: ['native/BloomMeetings/**', 'backend/**', '.github/workflows/bloom-meetings.yml']
  push:
    branches: [main]
    paths: ['native/BloomMeetings/**', 'backend/**', '.github/workflows/bloom-meetings.yml']
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path native/BloomMeetings
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: backend
      - run: bun run typecheck && bun run test
        working-directory: backend
